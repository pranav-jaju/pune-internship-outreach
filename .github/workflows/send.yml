# Pune December-internship outreach: sends the day's due rows of data/queue.csv at ~9:40 am IST
# on weekdays and commits data/sent_log.csv so nobody is mailed twice.
# Fully separate from the summer research outreach (different repo, queue, log and switch).
# To pause: Actions tab -> pune-send -> "..." -> Disable workflow.
name: pune-send
on:
  schedule:
    - cron: "11 4 * * 1-5"   # 09:41 IST, Mon-Fri
    - cron: "37 5 * * 1-5"   # 11:07 IST backup in case GitHub drops or delays the first; the sent log makes it a no-op otherwise
  workflow_dispatch:
    inputs:
      test_to:
        description: "Send today's first due mail to this address only (test, not logged)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: pune-send
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest tip, so a queued run sees the sent log the previous run committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send
        env:
          PUNE_SENDING_APPROVED: ${{ vars.PUNE_SENDING_APPROVED }}
          SENDER_NAME: Pranav Jaju
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL || 'pranavjaju@iitb.ac.in' }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp-auth.iitb.ac.in' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SENDER_APP_TOKEN: ${{ secrets.SENDER_APP_TOKEN }}
          RESUME_PATH: resume/PranavJaju_Resume.pdf
        run: |
          if [ -n "${{ inputs.test_to }}" ]; then
            python3 src/send.py --test-to "${{ inputs.test_to }}" --limit 1 --date 2099-12-31 --send
          else
            python3 src/send.py --send
          fi
      - name: Save the sent log
        if: always() && inputs.test_to == ''
        run: |
          [ -f data/sent_log.csv ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/sent_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Sent log $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
